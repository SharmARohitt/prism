[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-backend"
version = "0.1.0"
description = "PRISM — Persistent Repository Intelligence & Security Mapping"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<0.116",
    "uvicorn[standard]>=0.27.0,<0.33",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "sqlalchemy[asyncio]>=2.0.25,<3",
    "greenlet>=3.0.0,<4",
    "aiosqlite>=0.20.0,<1",
    # Git operations
    "GitPython>=3.1.40,<4",
    # Code intelligence — tree-sitter with individual language packages
    "tree-sitter>=0.23.0,<1",
    "tree-sitter-python>=0.23.0,<1",
    "tree-sitter-javascript>=0.23.0,<1",
    "tree-sitter-typescript>=0.23.0,<1",
    "tree-sitter-java>=0.23.0,<1",
    "tree-sitter-go>=0.23.0,<1",
    "tree-sitter-rust>=0.23.0,<1",
    "tree-sitter-ruby>=0.23.0,<1",
    "tree-sitter-c>=0.23.0,<1",
    "tree-sitter-cpp>=0.23.0,<1",
    "tree-sitter-bash>=0.23.0,<1",
    # LLM
    "httpx>=0.27.0,<1",
    # Utilities
    "python-dotenv>=1.0,<2",
    "structlog>=24.1.0,<25",
    "PyJWT>=2.8.0,<3",
    "cryptography>=42.0,<45",
    "psutil>=5.9,<7",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0,<1",
    "psycopg2-binary>=2.9.9,<3",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "pytest-cov>=4.1,<6",
    "httpx>=0.27.0,<1",
    "respx>=0.21.0,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
